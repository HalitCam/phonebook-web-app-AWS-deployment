AWSTemplateFormatVersion: 2010-09-09

Description:
  The Phonebook Application aims to create a phonebook application in Python and deployed as a web application with Flask on AWS Application Load Balancer with Auto Scaling Group of Elastic Compute Cloud (EC2) Instances and Relational Database Service (RDS) using AWS Cloudformation Service.  

Parameters:
  myKey: 
    Type: String
    Default: halit-key1
  myTokenGit:
    # Type: AWS::SSM::Parameter::Value<String>
    Type: String 
    Default: /myTokenGit
  myDatabaseName:
    Type : String 
    Default: /ondia/phonebook/database_name
  myDatabaseUserName:
    Type : String 
    Default: /ondia/phonebook/username
  myDatabasePassword:
    Type : String 
    Default: /ondia/phonebook/password
  myVpcId:
    Type: AWS::EC2::VPC::Id
  mySubnets:
    Type: 'List<AWS::EC2::Subnet::Id>'
    Description: A list of subnets for the Auto Scaling group

Resources:
  AppLoadBalancerSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http-80 access from Internet anywhere to ALB # Required
      GroupName: ALB-SecGroup
      SecurityGroupIngress: 
        - CidrIp: 0.0.0.0/0
          Description: Allow http access from Internet
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      VpcId: !Ref myVpcId
      
  ec2InstanceSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access at port 80 from ALB   # Required
      GroupName: ec2-SecGroup
      SecurityGroupIngress: 
        - Description: Allow access from ONLY ALB
          FromPort: 80
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt AppLoadBalancerSecGroup.GroupId
          ToPort: 80
        - Description: Allow connection port 22 from anywhere
          CidrIp: 0.0.0.0/0
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
      VpcId: !Ref myVpcId

  mySQLDatabeseSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access from only ec2-instance # Required
      GroupName: phonebookDB_SecGroup
      SecurityGroupIngress: 
        - Description: Allow access from ec2-instances to only database
          FromPort: 3306
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt ec2InstanceSecGroup.GroupId
          # SourceSecurityGroupName: "String"
          ToPort: 3306
      Tags: 
        - Key: Name
          Value: !Ref myDatabaseName  
      VpcId: !Ref myVpcId      
  
  mySQLDatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20
      AllowMajorVersionUpgrade: false
      ApplyImmediately: false
      # AssociatedRoles: 
      #   - FeatureName: "String"
      #     RoleArn: "String"
      AutoMinorVersionUpgrade: true
      # AvailabilityZone: "String"
      # CustomIAMInstanceProfile: "String"
      DBInstanceClass: db.t4g.micro
      DBInstanceIdentifier: mySQLPhonebookInstance
      DBName: !Ref myDatabaseName
      # DBSecurityGroups: 
      #   - !Ref mySQLDatabeseSecGroup   !! NEDEN ??
      # DeletionProtection: false
      Engine: mysql
      EngineVersion: 8.0.42
      MasterUserAuthenticationType: password
      MasterUserPassword: !Ref myDatabasePassword
      MasterUsername: !Ref myDatabaseUserName
      MaxAllocatedStorage: 40
      Port: 3306
      # PubliclyAccessible: false
      StorageType: gp2
      Tags: 
        - Key: Name
          Value: halit-Phonebook-db
      VPCSecurityGroups:
        - !GetAtt mySQLDatabeseSecGroup.GroupId
      #   - "String"
  
  myALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: phonebookALB
      Scheme: internet-facing
      SecurityGroups: 
        - !GetAtt AppLoadBalancerSecGroup.GroupId
      Subnets: !Ref mySubnets
      # Tags: 
      #   - Key: Name    !!! NOT GIVEN :: CHECK AT CONSOLE
      #     Value: "String"
      Type: application
  
  myALBlistener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !GetAtt myALB.LoadBalancerArn # Required
        Port: 80
        Protocol: HTTP
        DefaultActions: # Required
          - TargetGroupArn: !GetAtt myTargetGroup.TargetGroupArn
            Type: forward
        Tags: 
          - Key: Name
            Value: phonebook_ALB_Listener


  myTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 20
      HealthCheckPath: /
      HealthCheckPort: 80
      HealthCheckProtocol: HTTP
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 3
      IpAddressType: ipv4
      Name: phonebookTargetGroup
      Port: 80
      Protocol: HTTP
      # Tags: 
      #   - Key: "String"
      #     Value: "String"
      # TargetControlPort: 80 -GREKSIZMIS NEDEN ?
      TargetType: instance 
      # Targets: 
      #   - AvailabilityZone: "String"
      #     Id: "String"
      #     Port: "Number"
      #     QuicServerId: "String"
      UnhealthyThresholdCount: 2
      VpcId: !Ref myVpcId

  myAutoScaling:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: phonebookAutoScaling
      AvailabilityZoneDistribution:
        CapacityDistributionStrategy: balanced-best-effort 
      # AvailabilityZoneIds: 
      #   - "String"
      # Cooldown: 100
      # DefaultInstanceWarmup: "Number"
      DesiredCapacity: 2
      # DesiredCapacityType: "String"
      HealthCheckGracePeriod: 90
      HealthCheckType: ELB
      LaunchTemplate:
        LaunchTemplateId: !Ref myLaunchTemplate 
        Version: !GetAtt myLaunchTemplate.DefaultVersionNumber
      # LoadBalancerNames: 
      #   - "String"
      TargetGroupARNs:
        - !GetAtt myTargetGroup.TargetGroupArn
      MaxSize: 3 # Required
      MinSize: 1 # Required
      VPCZoneIdentifier: !Ref mySubnets

  myLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-launch-template
      LaunchTemplateData:
        ImageId: ami-081b0a6eac00b4f53
        InstanceType: t3.small
        IamInstanceProfile: 
          Name: !Ref myInstanceProfile
        KeyName: !Ref myKey
        SecurityGroupIds:
          - !GetAtt ec2InstanceSecGroup.GroupId
        UserData: !Base64 
          Fn::Sub: |
            #!/bin/bash
            sudo dnf update -y
            sudo dnf install python3 python3-pip -y
            sudo pip install Flask -y
            sudo pip install flask-mysql -y
            sudo dnf install git -y
            echo ${mySQLDatabaseInstance.Endpoint.Address} > dbserver.endpoint
            git clone https://${myTokenGit}@github.com/HalitCam/SQL-with-FlaskWebApp-deployment.git
            cd SQL-with-FlaskWebApp-deployment
            python3 phonebook-app.py

      TagSpecifications: 
        - ResourceType: launch-template
          Tags:
            - Key: Name
              Value: Web Server of StackName
      VersionDescription: 1.0.0

  myEC2instanceRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: InstanceRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: 'Allow'
            Principal:
              Service:
              - 'ec2.amazonaws.com'
            Action:
            - 'sts:AssumeRole'
        ManagedPolicyArns:
          - 'arn:aws:iam::aws:policy/AmazonRDSDataFullAccess'
  myInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: '/'
      Roles:
      - !Ref myEC2instanceRole

  

Outputs:
  myURL:
    Value: !Join
      - ''
      - - 'http://'
        - !GetAtt 
          - myALB
          - DNSName
    Description: Installation URL of the Flask Web Application
      
  
  