AWSTemplateFormatVersion: 2010-09-09

Description:
  The Phonebook Application aims to create a phonebook application in Python and deployed as a web application with Flask on AWS Application Load Balancer with Auto Scaling Group of Elastic Compute Cloud (EC2) Instances and Relational Database Service (RDS) using AWS Cloudformation Service.  

Parameters:
  myKey: 
    Description: Please enter your Key pair
    Type: AWS::EC2::KeyPair::KeyName
    Default: halit-key1

  myDatabaseUserName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /ondia/phonebook/username

  myVpcId:
    Type: AWS::EC2::VPC::Id
    Description: Please choose your VPC
  mySubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Please select your subnets used by ALB
  LatestAmiId: 
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    

Resources:
  AppLoadBalancerSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow http-80 access from Internet anywhere to ALB # Required
      GroupName: ALB-SecGroup
      SecurityGroupIngress: 
        - CidrIp: 0.0.0.0/0
          Description: Allow http access from Internet
          FromPort: 80
          IpProtocol: tcp
          ToPort: 80
      VpcId: !Ref myVpcId
      
  ec2InstanceSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access at port 80 from ALB and ssh access for anywhere   # Required
      GroupName: ec2-SecGroup
      SecurityGroupIngress: 
        - Description: Allow access from ONLY ALB
          FromPort: 80
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt AppLoadBalancerSecGroup.GroupId
          ToPort: 80
        - Description: Allow connection port 22 from anywhere
          CidrIp: 0.0.0.0/0
          FromPort: 22
          IpProtocol: tcp
          ToPort: 22
      VpcId: !Ref myVpcId

  mySQLDatabeseSecGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow access only from  ec2-instance # Required
      GroupName: phonebookDB_SecGroup
      SecurityGroupIngress: 
        - Description: Allow access from ec2-instances to only database
          FromPort: 3306
          IpProtocol: tcp
          SourceSecurityGroupId: !GetAtt ec2InstanceSecGroup.GroupId
          ToPort: 3306
      VpcId: !Ref myVpcId      
  
  mySQLDatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      AllocatedStorage: 20
      AllowMajorVersionUpgrade: false
      AutoMinorVersionUpgrade: true
      BackupRetentionPeriod: 0
      DBInstanceClass: db.t4g.micro
      DBInstanceIdentifier: mySQLPhonebookInstance
      DBName: ondia_phonebook
      DeletionProtection: false
      Engine: MySQL
      EngineVersion: 8.0.42
      MasterUserPassword: '{{resolve:ssm-secure:/ondia/phonebook/password:1}}' 
      MasterUsername: !Ref myDatabaseUserName
      MaxAllocatedStorage: 40
      Port: 3306
      PubliclyAccessible: true # in production normally false 
      StorageType: gp2
      Tags: 
        - Key: Name
          Value: halit-Phonebook-db
      VPCSecurityGroups:
        - !GetAtt mySQLDatabeseSecGroup.GroupId
    DeletionPolicy: Delete
  
  myALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      IpAddressType: ipv4
      Name: phonebookALB
      Scheme: internet-facing
      SecurityGroups: 
        - !GetAtt AppLoadBalancerSecGroup.GroupId
      Subnets: !Ref mySubnets
      # Tags: 
      #   - Key: Name    !!! NOT GIVEN :: CHECK AT CONSOLE
      #     Value: "String"
      Type: application
  
  myALBlistener:
      Type: AWS::ElasticLoadBalancingV2::Listener
      Properties:
        LoadBalancerArn: !GetAtt myALB.LoadBalancerArn # Required
        Port: 80
        Protocol: HTTP
        DefaultActions: # Required
          - TargetGroupArn: !GetAtt myTargetGroup.TargetGroupArn
            Type: forward
        Tags: 
          - Key: Name
            Value: phonebook_ALB_Listener


  myTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      Name: phonebookTargetGroup
      Port: 80
      Protocol: HTTP
      TargetType: instance 
      UnhealthyThresholdCount: 3
      VpcId: !Ref myVpcId

  myAutoScaling:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      DesiredCapacity: 2
      HealthCheckGracePeriod: 90
      HealthCheckType: ELB
      LaunchTemplate:
        LaunchTemplateId: !Ref myLaunchTemplate 
        Version: !GetAtt myLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !GetAtt myTargetGroup.TargetGroupArn
      MaxSize: 3 # Required
      MinSize: 1 # Required
      VPCZoneIdentifier: !Ref mySubnets

  myLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-launch-template'
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: t3.small
        IamInstanceProfile: 
          Name: !Ref myInstanceProfile
        KeyName: !Ref myKey
        SecurityGroupIds:
          - !GetAtt ec2InstanceSecGroup.GroupId
        UserData: !Base64 
          Fn::Sub: 
            - |
              #!/bin/bash 
              dnf update -y
              dnf install python3 python3-pip -y
              pip3 install Flask==2.3.3 
              pip3 install flask-mysql 
              pip3 install boto3 
              dnf install git -y
              echo "${MyDBURL}"  > /home/ec2-user/dbserver.endpoint
              cd /home/ec2-user
              git clone https://{{resolve:ssm-secure:/ondia/phonebook/token:1}}@github.com/HalitCam/SQL-with-FlaskWebApp-deployment.git
              cd SQL-with-FlaskWebApp-deployment
              python3 phonebook-app.py
            - MyDBURL: !GetAtt mySQLDatabaseInstance.Endpoint.Address
        TagSpecifications: 
        - ResourceType: instance
          Tags:
            - Key: Name
              Value: !Sub 'Web Server of ${AWS::StackName} Stack'

  myEC2instanceRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: SSNRoleWithManagedPolicy
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: 'Allow'
            Principal:
              Service:
              - 'ec2.amazonaws.com'
            Action:
            - 'sts:AssumeRole'
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/AmazonRDSDataFullAccess
          
  myInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: SSMinstanceProfile
      Roles:
      - !Ref myEC2instanceRole

Outputs:
  myURL:
    Value: !Join
      - ''
      - - 'http://'
        - !GetAtt 
          - myALB
          - DNSName
    Description: Installation Load Balancer URL of the Phonebook Application
      
  
  